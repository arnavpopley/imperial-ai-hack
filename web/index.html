<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ModuleMatch: an AI module advisor that explains every recommendation and checks every rule." />
    <meta name="theme-color" content="#4255ff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234255ff'/%3E%3Cpath d='M8.5 22.5V10.5l7.5 8 5-5.5 3.5-4' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24.5' cy='22' r='2.6' fill='%23ffcd1f'/%3E%3C/svg%3E"
    />
    <title>ModuleMatch</title>
    <script>
      // Set the theme before first paint so the page never flashes the wrong one: light unless dark was chosen.
      (function () {
        var t = 'light';
        try {
          if (localStorage.getItem('mm-theme') === 'dark') t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
